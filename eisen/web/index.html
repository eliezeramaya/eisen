<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eisen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>eisen</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Performance measurement: Largest Contentful Paint (LCP) -->
  <!-- Only active in debug/profile builds for development monitoring -->
  <script>
    (function() {
      // Check if we should enable LCP tracking (disable in production for privacy)
      // This can be controlled via URL parameter: ?measure_lcp=true
      const urlParams = new URLSearchParams(window.location.search);
      const shouldMeasureLCP = urlParams.get('measure_lcp') === 'true' || 
                               window.location.hostname === 'localhost' ||
                               window.location.hostname === '127.0.0.1';
      
      if (!shouldMeasureLCP) return;
      
      // Measure LCP using PerformanceObserver
      if ('PerformanceObserver' in window) {
        try {
          const observer = new PerformanceObserver((list) => {
            const entries = list.getEntries();
            const lastEntry = entries[entries.length - 1];
            
            if (lastEntry && lastEntry.renderTime) {
              const lcpMs = lastEntry.renderTime;
              console.log('[Performance] LCP:', lcpMs.toFixed(2), 'ms');
              
              // Send to Flutter via window message when app is ready
              window.addEventListener('flutter-initialized', () => {
                if (window.flutterMetrics && typeof window.flutterMetrics.recordLCP === 'function') {
                  window.flutterMetrics.recordLCP(lcpMs);
                }
              });
              
              // Also store globally for manual inspection
              window.__lcp_ms = lcpMs;
            }
          });
          
          observer.observe({ type: 'largest-contentful-paint', buffered: true });
          
          console.log('[Performance] LCP tracking enabled');
        } catch (e) {
          console.warn('[Performance] Failed to observe LCP:', e);
        }
      } else {
        console.warn('[Performance] PerformanceObserver not supported');
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
