name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter Pub Get
        run: |
          cd eisen
          flutter pub get
      - name: Generate l10n (Internationalization)
        run: |
          cd eisen
          flutter gen-l10n
      - name: Verify l10n Generation
        run: |
          cd eisen
          # Verify generated files exist (configured in l10n.yaml to output-dir: lib/l10n)
          if [ ! -f "lib/l10n/app_localizations.dart" ]; then
            echo "Error: l10n generation failed - app_localizations.dart not found"
            exit 1
          fi
          echo "✓ l10n files generated successfully"
      - name: Analyze
        run: |
          cd eisen
          flutter analyze
      - name: Test (including i18n ARB validation)
        run: |
          cd eisen
          flutter test --no-pub
      - name: Build Web
        run: |
          cd eisen
          flutter build web --no-tree-shake-icons --release
