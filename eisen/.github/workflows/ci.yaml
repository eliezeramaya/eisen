name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commitlint (conventional commits)
        run: |
          if command -v npm >/dev/null 2>&1; then
            if [ -f package.json ]; then
              echo "Running commitlint at repo root"
              npm install --no-fund --no-audit || true
              npm run commitlint || true
            elif [ -f eisen/package.json ]; then
              echo "Running commitlint in eisen/"
              cd eisen
              npm install --no-fund --no-audit || true
              npm run commitlint || true
            else
              echo "No package.json; skipping commitlint"
            fi
          else
            echo "npm not available; skipping commitlint"
          fi
      
      # Cache Pub dependencies for faster builds
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            eisen/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Flutter Pub Get
        run: |
          cd eisen
          flutter pub get
      
      - name: Generate l10n (Internationalization)
        run: |
          cd eisen
          flutter gen-l10n
      
      - name: Verify l10n Generation
        run: |
          cd eisen
          # Verify generated files exist (configured in l10n.yaml to output-dir: lib/l10n)
          if [ ! -f "lib/l10n/app_localizations.dart" ]; then
            echo "Error: l10n generation failed - app_localizations.dart not found"
            exit 1
          fi
          echo "✓ l10n files generated successfully"
      
      - name: Analyze (non-fatal)
        run: |
          cd eisen
          dart analyze --no-fatal-warnings || true
      
      - name: Test with coverage (unit + widget)
        run: |
          cd eisen
          flutter test --coverage --no-pub test/unit test/widget --exclude-tags=golden
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: eisen/coverage/lcov.info
          if-no-files-found: warn
      
      - name: Upload golden test failures (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: eisen/test/**/failures/*.png
          if-no-files-found: ignore
      
      - name: Build Web
        run: |
          cd eisen
          flutter build web --no-tree-shake-icons --release
      
      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: eisen/build/web
          if-no-files-found: error
