name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commitlint (conventional commits)
        run: |
          if command -v npm >/dev/null 2>&1; then
            if [ -f package.json ]; then
              echo "Running commitlint at repo root"
              npm install --no-fund --no-audit || true
              npm run commitlint || true
            elif [ -f eisen/package.json ]; then
              echo "Running commitlint in eisen/"
              cd eisen
              npm install --no-fund --no-audit || true
              npm run commitlint || true
            else
              echo "No package.json; skipping commitlint"
            fi
          else
            echo "npm not available; skipping commitlint"
          fi
      
      # Cache Pub dependencies for faster builds
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            eisen/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Flutter Pub Get
        run: |
          cd eisen
          flutter pub get
      
      - name: Generate l10n (Internationalization)
        run: |
          cd eisen
          flutter gen-l10n
      
      - name: Verify l10n Generation
        run: |
          cd eisen
          # Verify generated files exist (configured in l10n.yaml to output-dir: lib/l10n)
          if [ ! -f "lib/l10n/app_localizations.dart" ]; then
            echo "Error: l10n generation failed - app_localizations.dart not found"
            exit 1
          fi
          echo "✓ l10n files generated successfully"
      
      - name: Analyze (non-fatal)
        run: |
          cd eisen
          dart analyze --no-fatal-warnings || true
      
      - name: Test with coverage (unit + widget)
        run: |
          cd eisen
          flutter test --coverage --no-pub test/unit test/widget --exclude-tags=golden

      - name: Coverage gate (>=70%)
        run: |
          cd eisen
          python - <<'PY'
          import os, re, sys, pathlib
          path = pathlib.Path("coverage/lcov.info")
          if not path.exists():
              print("lcov.info not found")
              sys.exit(1)
          data = path.read_text()
          total = sum(int(x) for x in re.findall(r'LF:(\d+)', data))
          hit = sum(int(x) for x in re.findall(r'LH:(\d+)', data))
          pct = 0.0 if total == 0 else (hit / total) * 100
          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "70"))
          print(f"Coverage: {pct:.2f}% (threshold {threshold}%)")
          if pct < threshold:
              sys.exit(1)
          PY
        env:
          COVERAGE_THRESHOLD: 70

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Golden tests (no update)
        run: |
          cd eisen
          flutter test --no-pub test/golden
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: eisen/coverage/lcov.info
          if-no-files-found: warn
      
      - name: Upload golden test failures (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: eisen/test/**/failures/*.png
          if-no-files-found: ignore
      
      - name: Build Web
        run: |
          cd eisen
          flutter build web --no-tree-shake-icons --release

      - name: Install Lighthouse CI (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          if command -v npm >/dev/null 2>&1; then
            npm i -g @lhci/cli@0.14.0 http-server@14 || true
          else
            echo "npm not available; skipping lhci install"
          fi

      - name: Run Lighthouse CI (desktop profile)
        if: always()
        continue-on-error: true
        working-directory: eisen/build/web
        run: |
          if command -v http-server >/dev/null 2>&1 && command -v lhci >/dev/null 2>&1; then
            nohup http-server -p 8080 -s >/dev/null 2>&1 &
            sleep 3
            lhci autorun --upload.target=temporary-public-storage --collect.url=http://127.0.0.1:8080 --assert.assertions.file=../../lighthouserc.json || true
          else
            echo "lhci/http-server not available; skipping"
          fi

      - name: Upload Lighthouse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            ~/.lhci/**/*
            .lighthouseci/**/*
          if-no-files-found: ignore
      
      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: eisen/build/web
          if-no-files-found: error

  integration_tests:
    runs-on: ubuntu-latest
    needs: analyze_test_build
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Flutter Pub Get
        run: |
          cd eisen
          flutter pub get
      - name: Run integration tests
        run: |
          cd eisen
          flutter test integration_test
