name: Flutter CI

on:
  pull_request:
    paths:
      - 'eisen/**'
      - '.github/workflows/flutter_ci.yml'
  push:
    branches:
      - main
    paths:
      - 'eisen/**'
      - '.github/workflows/flutter_ci.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eisen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >
          dart format --set-exit-if-changed
          lib/core/analytics/analytics_events.dart
          lib/core/backend
          lib/core/config
          lib/core/feature_flags
          lib/core/observability
          lib/core/storage
          lib/core/sync/sync_metadata.dart
          lib/core/sync/sync_queue.dart
          lib/core/sync/sync_repository.dart
          lib/core/sync/sync_status.dart
          lib/core/sync/syncable_entity.dart
          test/core
          test/helpers

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
